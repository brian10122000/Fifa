<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>FC27 Deal Detector</title>
<style>
  :root {
    --bg: #0a0a14; --surface: #12121f; --card: #1a1a2e;
    --border: #2a2a45; --accent: #3b82f6; --green: #22c55e;
    --red: #ef4444; --gold: #f59e0b; --text: #e2e8f0; --muted: #64748b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; min-height: 100vh; }

  header { background: var(--surface); border-bottom: 1px solid var(--border);
           padding: 0 24px; height: 56px; display: flex; align-items: center; gap: 16px; position: sticky; top: 0; z-index: 100; }
  header h1 { font-size: 18px; font-weight: 700; color: var(--accent); letter-spacing: .5px; }
  .badge { background: var(--accent); color: #fff; font-size: 11px; padding: 2px 8px; border-radius: 99px; font-weight: 700; }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); margin-left: auto; }
  .status-dot.live { background: var(--green); box-shadow: 0 0 6px var(--green); animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.5} }
  #status-text { font-size: 13px; color: var(--muted); }
  #deal-count { font-size: 13px; font-weight: 700; color: var(--green); }

  .layout { display: grid; grid-template-columns: 260px 1fr; min-height: calc(100vh - 56px); }

  aside { background: var(--surface); border-right: 1px solid var(--border); padding: 20px; display: flex; flex-direction: column; gap: 14px; }
  aside h2 { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
  .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 5px; }
  .field input, .field select {
    width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
    color: var(--text); padding: 8px 10px; font-size: 13px; outline: none; transition: border .2s;
  }
  .field input:focus { border-color: var(--accent); }
  .platform-toggle { display: flex; gap: 8px; }
  .platform-toggle button {
    flex: 1; padding: 8px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--bg); color: var(--muted); cursor: pointer; font-size: 13px; transition: all .2s;
  }
  .platform-toggle button.active { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }
  .sep { height: 1px; background: var(--border); }
  .scan-btn {
    background: var(--accent); color: #fff; border: none; border-radius: 8px;
    padding: 11px; font-size: 14px; font-weight: 700; cursor: pointer; transition: background .2s;
  }
  .scan-btn:hover { background: #2563eb; }
  .scan-btn.stop { background: var(--red); }
  .auto-row { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
  .toggle-switch { position: relative; width: 36px; height: 20px; }
  .toggle-switch input { opacity: 0; width: 0; height: 0; }
  .slider-sw { position: absolute; inset: 0; background: var(--border); border-radius: 20px; cursor: pointer; transition: .2s; }
  .slider-sw:before { content:''; position:absolute; width:14px; height:14px; left:3px; top:3px; background:#fff; border-radius:50%; transition:.2s; }
  input:checked + .slider-sw { background: var(--accent); }
  input:checked + .slider-sw:before { transform: translateX(16px); }

  main { padding: 20px; overflow-y: auto; }
  .filters-bar { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
  .filter-chip {
    background: var(--surface); border: 1px solid var(--border); border-radius: 99px;
    padding: 5px 14px; font-size: 12px; cursor: pointer; transition: all .15s; color: var(--muted);
  }
  .filter-chip.active { border-color: var(--accent); color: var(--accent); background: rgba(59,130,246,.1); }
  #results { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 12px; }

  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 14px; display: grid; grid-template-columns: 80px 1fr auto; gap: 12px;
    align-items: center; transition: border .2s, transform .15s;
  }
  .card:hover { transform: translateY(-2px); border-color: #3a3a60; }
  .card.error { border-color: var(--red); box-shadow: 0 0 0 1px rgba(239,68,68,.2); }
  .card.good  { border-color: var(--green); }
  .player-img { width: 80px; height: 80px; border-radius: 8px; object-fit: cover; background: var(--border); }
  .player-info { min-width: 0; }
  .player-name { font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .player-meta { font-size: 11px; color: var(--muted); margin: 3px 0 6px; }
  .prices { font-size: 12px; color: var(--muted); }
  .prices span { color: #7dd3fc; font-weight: 600; }
  .profit-col { text-align: right; min-width: 80px; }
  .profit-val { font-size: 15px; font-weight: 800; color: var(--green); }
  .profit-val.neg { color: var(--red); }
  .profit-pct { font-size: 12px; color: var(--muted); }
  .err-badge { font-size: 10px; font-weight: 800; color: var(--red); letter-spacing: .5px; margin-top: 4px; }
  .rating-pill { display: inline-block; background: var(--gold); color: #000; border-radius: 4px; font-size: 11px; font-weight: 800; padding: 1px 6px; margin-right: 4px; }

  .empty { grid-column: 1/-1; text-align: center; padding: 60px 20px; color: var(--muted); }
  .empty .icon { font-size: 48px; margin-bottom: 12px; }

  #toast { position: fixed; bottom: 20px; right: 20px; background: var(--surface); border: 1px solid var(--border);
           border-radius: 8px; padding: 10px 16px; font-size: 13px; opacity: 0; pointer-events: none; transition: opacity .3s; z-index: 999; }
  #toast.show { opacity: 1; }

  @media (max-width: 700px) {
    .layout { grid-template-columns: 1fr; }
    aside { display: none; }
  }
</style>
</head>
<body>

<header>
  <h1>⚽ FC27 Deals</h1>
  <span class="badge">LIVE</span>
  <div class="status-dot" id="status-dot"></div>
  <span id="status-text">Prêt</span>
  <span id="deal-count"></span>
</header>

<div class="layout">
<aside>
  <h2>Plateforme</h2>
  <div class="platform-toggle">
    <button class="active" id="btn-ps" onclick="setPlatform('ps')">PlayStation</button>
    <button id="btn-pc" onclick="setPlatform('pc')">PC</button>
  </div>
  <div class="sep"></div>
  <h2>Filtres</h2>
  <div class="field"><label>Rating min</label><input type="number" id="f-rmin" value="82" min="50" max="99"/></div>
  <div class="field"><label>Rating max</label><input type="number" id="f-rmax" value="99" min="50" max="99"/></div>
  <div class="field"><label>Prix max achat (coins)</label><input type="number" id="f-pmax" value="500000" step="1000"/></div>
  <div class="field"><label>Profit min (coins)</label><input type="number" id="f-profit" value="1000" step="500"/></div>
  <div class="field"><label>Marge min %</label><input type="number" id="f-pct" value="3" step="0.5"/></div>
  <div class="field"><label>Ratio erreur prix (ex: 0.80)</label><input type="number" id="f-ratio" value="0.80" step="0.05" min="0.1" max="1"/></div>
  <div class="field"><label>Pages à scanner</label><input type="number" id="f-pages" value="5" min="1" max="20"/></div>
  <div class="sep"></div>
  <div class="auto-row">
    <label class="toggle-switch"><input type="checkbox" id="f-auto"/><span class="slider-sw"></span></label>
    Auto-refresh (2 min)
  </div>
  <button class="scan-btn" id="scan-btn" onclick="toggleScan()">▶  Scanner</button>
</aside>

<main>
  <div class="filters-bar">
    <span class="filter-chip active" onclick="setSort('profit',this)">💰 Meilleur profit</span>
    <span class="filter-chip" onclick="setSort('pct',this)">📈 Meilleure marge %</span>
    <span class="filter-chip" onclick="setSort('error',this)">⚠ Erreurs prix</span>
    <span class="filter-chip" onclick="setSort('price',this)">🔽 Prix bas</span>
    <span class="filter-chip" onclick="setSort('rating',this)">⭐ Rating</span>
  </div>
  <div id="results">
    <div class="empty"><div class="icon">⚽</div><p>Lance un scan pour voir les deals</p></div>
  </div>
</main>
</div>

<div id="toast"></div>

<script>
const BASE = "https://www.futbin.com";
const YEAR = "27";
const PROXIES = [
  url => `https://corsproxy.io/?${encodeURIComponent(url)}`,
  url => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
  url => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`,
];
let proxyIdx = 0;
let platform = "ps";
let scanning = false;
let autoTimer = null;
let allRaw    = [];
let sortMode  = "profit";

const $ = id => document.getElementById(id);
const coins = v => { const s = String(v||"").replace(/[^\d.]/g,""); return s ? Math.round(parseFloat(s)) : 0; };
const fmt   = n => Number(n).toLocaleString("fr-FR");

function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 3000);
}
function setStatus(msg, live=false) {
  $("status-text").textContent = msg;
  $("status-dot").className = "status-dot" + (live ? " live" : "");
}
function setPlatform(p) {
  platform = p;
  $("btn-ps").className = p === "ps" ? "active" : "";
  $("btn-pc").className = p === "pc" ? "active" : "";
  if (allRaw.length) render(allRaw);
}
function setSort(mode, el) {
  sortMode = mode;
  document.querySelectorAll(".filter-chip").forEach(c => c.classList.remove("active"));
  el.classList.add("active");
  if (allRaw.length) render(allRaw);
}

async function fetchWithProxy(url) {
  for (let i = 0; i < PROXIES.length; i++) {
    const idx = (proxyIdx + i) % PROXIES.length;
    try {
      const r = await fetch(PROXIES[idx](url), { headers: { Accept: "application/json,text/html,*/*" } });
      if (!r.ok) continue;
      const text = await r.text();
      if (text.length < 100) continue;
      proxyIdx = idx;
      return text;
    } catch(e) { continue; }
  }
  return null;
}

function parsePlayers(data) {
  let arr = data;
  if (typeof data === "object" && !Array.isArray(data)) {
    for (const k of ["data","players","results","items"]) {
      if (Array.isArray(data[k])) { arr = data[k]; break; }
    }
    if (!Array.isArray(arr)) {
      const vals = Object.values(data).filter(v => Array.isArray(v));
      arr = vals[0] || [];
    }
  }
  if (!Array.isArray(arr)) return [];
  return arr.map(item => {
    try {
      const ps = coins(item.ps_price || item["PS Price"] || 0);
      const pc = coins(item.pc_price || item["PC Price"] || 0);
      if (!ps && !pc) return null;
      const name = String(item.Player || item.name || item.player_name || "").trim();
      if (!name) return null;
      return {
        id:      String(item.id || item.player_id || item.resource_id || "0"),
        name, rating: parseInt(item.Rating || item.rating || 0),
        pos:     String(item.Position || item.position || ""),
        version: String(item.Version  || item.version  || ""),
        ps, pc,
        low: coins(item.lowest_price || item["Futbin Low"] || 0),
        avg: coins(item.avg_price    || item["Avg Price"]  || item.futbin_avg || 0),
      };
    } catch(e) { return null; }
  }).filter(Boolean);
}

function parseHTML(html) {
  for (const pat of [
    /var\s+players\s*=\s*(\[[\s\S]*?\]);/,
    /playersData\s*=\s*(\[[\s\S]*?\]);/,
    /"data"\s*:\s*(\[[\s\S]*?\])/,
  ]) {
    const m = html.match(pat);
    if (m) { try { const p = parsePlayers(JSON.parse(m[1])); if (p.length) return p; } catch(e) {} }
  }
  const doc = new DOMParser().parseFromString(html, "text/html");
  const rows = [...doc.querySelectorAll("#repTb tbody tr, [data-player-id]")];
  return rows.map(row => {
    try {
      const g = col => { const el = row.querySelector(`td[data-col='${col}']`); return el ? el.textContent.trim() : row.getAttribute(`data-${col.toLowerCase().replace(" ","_")}`) || ""; };
      const nameEl = row.querySelector("td a.player_name, .player-name a, a[href*='/player/']");
      if (!nameEl) return null;
      const ps = coins(g("PS Price") || row.getAttribute("data-ps_price") || 0);
      const pc = coins(g("PC Price") || row.getAttribute("data-pc_price") || 0);
      if (!ps && !pc) return null;
      return {
        id: row.getAttribute("data-player-id") || "0",
        name: nameEl.textContent.trim(),
        rating: parseInt((g("Rating")||"0").replace(/\D/g,"").slice(0,3)) || 0,
        pos: g("Position") || row.getAttribute("data-position") || "",
        version: g("Version") || row.getAttribute("data-version") || "",
        ps, pc,
        low: coins(g("Futbin Low")),
        avg: coins(g("Avg Price")),
      };
    } catch(e) { return null; }
  }).filter(Boolean).filter(p => p.name);
}

async function fetchPage(page) {
  const rmin = parseInt($("f-rmin").value || 82);
  const rmax = parseInt($("f-rmax").value || 99);
  const pmax = parseInt($("f-pmax").value || 500000);

  const searchUrl = `${BASE}/search?year=${YEAR}&type=player&page=${page}&player_rating=${rmin}-${rmax}&${platform}_price=200-${pmax}&sort=${platform}_price&order=asc`;
  const jsonText  = await fetchWithProxy(searchUrl);
  if (jsonText) {
    try {
      const p = parsePlayers(JSON.parse(jsonText));
      if (p.length) { console.log(`p${page} json: ${p.length}`); return p; }
    } catch(e) {}
  }

  const htmlUrl  = `${BASE}/${YEAR}/players?page=${page}&player_rating=${rmin}-${rmax}&${platform}_price=200-${pmax}`;
  const htmlText = await fetchWithProxy(htmlUrl);
  if (htmlText) {
    const p = parseHTML(htmlText);
    console.log(`p${page} html: ${p.length}`);
    return p;
  }
  return [];
}

function calcDeals(players) {
  const minProfit = parseInt($("f-profit").value || 1000);
  const minPct    = parseFloat($("f-pct").value   || 3);
  const ratio     = parseFloat($("f-ratio").value  || 0.80);
  return players.map(p => {
    const buy    = platform === "ps" ? p.ps : p.pc;
    const avg    = p.avg || Math.max(p.ps, p.pc);
    const low    = p.low || Math.min(...[p.ps, p.pc].filter(x=>x>0));
    const profit = avg > 0 ? Math.floor(avg * 0.95) - buy : 0;
    const pct    = buy > 0 ? (profit / buy) * 100 : 0;
    const isErr  = buy > 0 && low > 0 && buy < low * ratio;
    return { ...p, buy, avg, low, profit, pct, isErr };
  }).filter(p => p.buy > 0 && p.profit >= minProfit && p.pct >= minPct);
}

function sorted(deals) {
  switch(sortMode) {
    case "pct":    return [...deals].sort((a,b) => b.pct    - a.pct);
    case "error":  return [...deals].sort((a,b) => b.isErr  - a.isErr  || b.profit - a.profit);
    case "price":  return [...deals].sort((a,b) => a.buy    - b.buy);
    case "rating": return [...deals].sort((a,b) => b.rating - a.rating);
    default:       return [...deals].sort((a,b) => b.profit - a.profit);
  }
}

function render(raw) {
  const list = sorted(calcDeals(raw));
  $("deal-count").textContent = list.length ? `${list.length} deal${list.length>1?"s":""}` : "";
  const el = $("results");
  if (!list.length) {
    el.innerHTML = `<div class="empty"><div class="icon">🔍</div><p>Aucun deal — élargis les filtres</p></div>`;
    return;
  }
  el.innerHTML = list.map(p => `
    <div class="card ${p.isErr?"error":p.profit>5000?"good":""}">
      <img class="player-img"
           src="https://cdn.futbin.com/content/fifa27/img/players/${p.id}.png"
           alt="${p.name}"
           onerror="this.src='https://cdn.futbin.com/content/fifa27/img/misc/football.png'"/>
      <div class="player-info">
        <div class="player-name"><span class="rating-pill">${p.rating}</span>${p.name}</div>
        <div class="player-meta">${p.pos} · ${p.version.slice(0,16)}</div>
        <div class="prices">Achat <span>${fmt(p.buy)} 🪙</span> · Low ${fmt(p.low)} · Avg ${fmt(p.avg)}</div>
        ${p.isErr?'<div class="err-badge">⚠ ERREUR PRIX</div>':''}
      </div>
      <div class="profit-col">
        <div class="profit-val ${p.profit<0?"neg":""}">+${fmt(p.profit)}</div>
        <div class="profit-pct">${p.pct.toFixed(1)}%</div>
      </div>
    </div>`).join("");
}

async function doScan() {
  const pages = parseInt($("f-pages").value || 5);
  let all = [];
  setStatus("Scan...", true);
  for (let pg = 1; pg <= pages; pg++) {
    if (!scanning) break;
    setStatus(`Page ${pg}/${pages}...`, true);
    const batch = await fetchPage(pg);
    all = [...all, ...batch];
    if (!batch.length) break;
    await new Promise(r => setTimeout(r, 1200));
  }
  allRaw = all;
  render(all);
  const deals = calcDeals(all);
  setStatus(`${deals.length} deal(s) sur ${all.length} joueurs`, false);
  toast(`✅ ${deals.length} deal(s) trouvé(s)`);
}

function toggleScan() {
  if (scanning) {
    scanning = false;
    clearTimeout(autoTimer);
    $("scan-btn").textContent = "▶  Scanner";
    $("scan-btn").classList.remove("stop");
    setStatus("Arrêté", false);
  } else {
    scanning = true;
    $("scan-btn").textContent = "⏹  Stop";
    $("scan-btn").classList.add("stop");
    runLoop();
  }
}

async function runLoop() {
  await doScan();
  if (!scanning) return;
  if ($("f-auto").checked) {
    let r = 120;
    const tick = () => {
      if (!scanning) return;
      setStatus(`Prochain scan dans ${r}s`, false);
      if (--r < 0) { runLoop(); return; }
      autoTimer = setTimeout(tick, 1000);
    };
    tick();
  } else {
    scanning = false;
    $("scan-btn").textContent = "▶  Scanner";
    $("scan-btn").classList.remove("stop");
  }
}
</script>
</body>
</html>
