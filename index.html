<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FC 27 PC – Flip Desk</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0d1220;--panel:#151c30;--line:#26304d;--text:#e8ecf6;--muted:#8d99b8;--gain:#3ddc97;--gold:#f2c14e;--loss:#ff6b6b}
  body{background:var(--bg);color:var(--text);font-family:Barlow,system-ui,sans-serif}
  .head{font-family:'Barlow Condensed',sans-serif;letter-spacing:.01em}
  .panel{background:var(--panel);border:1px solid var(--line)}
  .num{font-variant-numeric:tabular-nums}
  button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  .tab[aria-selected=true]{color:var(--text);border-color:var(--gold)}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  .spin{animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body class="min-h-screen">
<header class="border-b" style="border-color:var(--line)">
  <div class="max-w-6xl mx-auto px-4 py-5 flex flex-wrap items-end gap-4 justify-between">
    <div>
      <h1 class="head text-4xl font-bold leading-none">Flip Desk <span style="color:var(--gold)">FC 27</span></h1>
      <p class="text-sm mt-1" style="color:var(--muted)">Marché PC · profit net après taxe EA de 5%</p>
    </div>
    <div class="flex flex-wrap items-end gap-3">
      <label class="text-sm">
        <span class="block mb-1" style="color:var(--muted)">Budget (coins)</span>
        <input id="budget" type="number" min="0" step="1000" placeholder="ex. 150000" class="num w-40 rounded px-3 py-2 panel">
      </label>
      <button id="refresh" class="rounded px-4 py-2 font-semibold flex items-center gap-2" style="background:var(--gold);color:#1a1405">
        <svg id="ico" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 12a9 9 0 1 1-3-6.7M21 3v6h-6"/></svg>
        Actualiser les données
      </button>
    </div>
  </div>
</header>

<main class="max-w-6xl mx-auto px-4 py-6">
  <div class="flex items-center justify-between flex-wrap gap-2 mb-4">
    <div role="tablist" class="flex gap-6 border-b w-full sm:w-auto" style="border-color:var(--line)">
      <button role="tab" id="t-deals" aria-selected="true" class="tab head text-xl pb-2 border-b-2 border-transparent" style="color:var(--muted)">Flips immédiats</button>
      <button role="tab" id="t-fodder" aria-selected="false" class="tab head text-xl pb-2 border-b-2 border-transparent" style="color:var(--muted)">Fodder &amp; investissements</button>
    </div>
    <p id="meta" class="text-sm" style="color:var(--muted)" aria-live="polite"></p>
  </div>

  <section id="deals" class="panel rounded-lg overflow-x-auto"></section>
  <section id="fodder" class="hidden gap-3 sm:grid-cols-2 lg:grid-cols-3"></section>

  <p class="text-xs mt-6" style="color:var(--muted)">
    Net = prix de vente × 0,95 − prix d'achat. Les prix sont simulés tant qu'aucune source live n'est configurée (voir README). Ce n'est pas un conseil garanti : vérifie toujours le prix en jeu avant d'acheter.
  </p>
</main>
<script src="app.js"></script>
</body>
</html>
