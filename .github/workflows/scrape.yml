# .github/workflows/scrape.yml

name: FC27 Scraper

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install curl_cffi
        run: pip install curl-cffi -q

      - name: Scrape futbin
        run: python scraper.py

      - name: Commit deals.json
        run: |
          git config user.name  "FC27 Bot"
          git config user.email "bot@fc27.local"
          git add deals.json
          git diff --staged --quiet || git commit -m "update deals $(date -u +%H:%M)"
          git push
